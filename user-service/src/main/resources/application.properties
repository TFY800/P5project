spring.application.name=user-service
server.port=8081
server.address=${BIND_ADDRESS:127.0.0.1}
app.jwt-secret=${JWT_SECRET}
app.internal-secret=${INTERNAL_SECRET}
app.cors-origin=${CLIENT_ORIGIN:http://localhost:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${USER_DB_URL:jdbc:postgresql://localhost:55432/p5_user}
spring.datasource.username=${USER_DB_USER:p5_user}
spring.datasource.password=${USER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
