spring.application.name=auction-service
server.port=8083
server.address=${BIND_ADDRESS:127.0.0.1}
app.jwt-secret=${JWT_SECRET}
app.internal-secret=${INTERNAL_SECRET}
app.cors-origin=${CLIENT_ORIGIN:http://localhost:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
spring.datasource.url=${AUCTION_DB_URL:jdbc:postgresql://localhost:55432/p5_auction}
spring.datasource.username=${AUCTION_DB_USER:p5_auction}
spring.datasource.password=${AUCTION_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
app.item-url=${ITEM_API_URL:http://localhost:8082}
app.notification-url=${NOTIFICATION_API_URL:http://localhost:8084}
spring.task.scheduling.pool.size=3
spring.jackson.deserialization.accept-float-as-int=false
